<!doctype html>
<html lang="{{ config.default_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock %}">
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
  <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='atom.xml', trailing_slash=false) }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>¶</text></svg>">
</head>
<body>
  <header class="site-header">
    <a class="site-title" href="{{ config.base_url }}/">{{ config.title }}</a>
    <nav>
      {% for item in config.extra.nav %}
        <a href="{{ get_url(path=item.path) }}"{% if item.path in (current_path or "") %} aria-current="page"{% endif %}>{{ item.name }}</a>
      {% endfor %}
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <span>© {{ now() | date(format="%Y") }} {{ config.extra.author }}</span>
    <span><a href="{{ config.extra.github }}">GitHub</a> · <a href="{{ get_url(path='atom.xml', trailing_slash=false) }}">RSS</a></span>
  </footer>
</body>
</html>
