{% extends "base.html" %}
{% block title %}Tags · {{ config.title }}{% endblock %}
{% block content %}
<h1>Tags</h1>
<ul class="tag-cloud">
  {% for term in terms %}<li><a href="{{ term.permalink }}">#{{ term.name }}</a> <span class="meta">{{ term.pages | length }}</span></li>{% endfor %}
</ul>
{% endblock %}
